<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PAS-PAS — Naufrage au large de Lompoul</title>
<style>
  @font-face { font-family: Poppins; src: url(assets/fonts/poppins-400.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(assets/fonts/poppins-500.woff2) format('woff2'); font-weight: 500; }
  @font-face { font-family: Poppins; src: url(assets/fonts/poppins-600.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: Poppins; src: url(assets/fonts/poppins-700.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: Poppins; src: url(assets/fonts/poppins-800.woff2) format('woff2'); font-weight: 800; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">espace : lecture/pause · ←/→ : image par image · clic : naviguer · ?format=9x16 pour la version verticale</div>
<script type="module" src="film.js"></script>
</body>
</html>
