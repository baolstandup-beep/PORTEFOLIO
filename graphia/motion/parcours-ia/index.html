<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --green: #078d43;
        --ink: #080808;
        --sun: #f5e500;
        --paper: #ffffff;
        --mist: #f5f5f5;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; font-family: 'Poppins', sans-serif; color: var(--ink); }
      #pi-bg { position: absolute; inset: 0; background: var(--paper); }
      #pi-tag { position: absolute; left: 96px; top: 96px; font-size: 20px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--green); }
      #pi-level { position: absolute; left: 96px; top: 136px; display: flex; align-items: flex-end; gap: 18px; }
      #pi-pct { position: relative; display: block; width: 330px; height: 140px; }
      .pi-p, .pi-t { position: absolute; left: 0; bottom: 0; white-space: nowrap; }
      .pi-p { font-size: 132px; font-weight: 900; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; min-width: 300px; }
      #pi-pct small { font-size: 64px; font-weight: 800; color: var(--green); }
      #pi-name { position: relative; display: block; width: 520px; height: 50px; }
      .pi-t { font-size: 34px; font-weight: 700; color: var(--ink); }
      #pi-track { position: absolute; left: 140px; right: 140px; top: 440px; height: 10px; border-radius: 10px; background: #e3e3e3; }
      #pi-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--green), #2bb36a); transform-origin: left center; }
      .pi-node { position: absolute; top: 445px; width: 0; height: 0; }
      .pi-dot { position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border-radius: 50%; background: var(--paper); border: 5px solid #bdbdbd; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #5f5f5f; }
      .pi-label { position: absolute; left: -110px; width: 220px; top: 44px; text-align: center; font-size: 19px; font-weight: 600; line-height: 1.25; color: var(--ink); }
      #pi-walker { position: absolute; top: 350px; left: 140px; width: 0; height: 0; }
      #pi-avatar { position: absolute; left: -34px; top: -34px; width: 68px; height: 68px; border-radius: 50%; background: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(8,8,8,0.25); }
      .pi-p, .pi-t { opacity: 0; }
      #pi-p0, #pi-t0 { opacity: 1; }
      #pi-n1 .pi-dot { background: var(--green); border-color: var(--green); color: #fff; }
      #pi-fill { transform: scaleX(0); }
      #pi-badge { opacity: 0; transform: scale(0.6); position: absolute; right: 96px; top: 170px; padding: 18px 30px; border-radius: 999px; background: var(--sun); font-size: 30px; font-weight: 800; display: flex; align-items: center; gap: 14px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1280" data-height="720">
      <div id="pi-bg"></div>
      <p id="pi-tag" class="clip" data-start="0" data-duration="12" data-track-index="1">Parcours GRAPHIA</p>
      <div id="pi-level" class="clip" data-start="0" data-duration="12" data-track-index="2">
        <span id="pi-pct">
          <span class="pi-p" id="pi-p0">5<small>%</small></span><span class="pi-p" id="pi-p1">22<small>%</small></span><span class="pi-p" id="pi-p2">45<small>%</small></span><span class="pi-p" id="pi-p3">66<small>%</small></span><span class="pi-p" id="pi-p4">85<small>%</small></span><span class="pi-p" id="pi-p5">100<small>%</small></span>
        </span>
        <span id="pi-name">
          <span class="pi-t" id="pi-t0">Débutant</span><span class="pi-t" id="pi-t1">Découverte de l’IA</span><span class="pi-t" id="pi-t2">Nouvelles compétences</span><span class="pi-t" id="pi-t3">Premiers projets</span><span class="pi-t" id="pi-t4">Expertise</span><span class="pi-t" id="pi-t5">Professionnel</span>
        </span>
      </div>
      <div id="pi-track" class="clip" data-start="0" data-duration="12" data-track-index="3"><div id="pi-fill"></div></div>

      <div class="pi-node clip" data-layout-allow-overflow id="pi-n1" style="left:140px" data-start="0" data-duration="12" data-track-index="4"><div class="pi-dot">1</div><p class="pi-label">Débutant</p></div>
      <div class="pi-node clip" data-layout-allow-overflow id="pi-n2" style="left:340px" data-start="0" data-duration="12" data-track-index="4"><div class="pi-dot">2</div><p class="pi-label">Découverte des outils IA</p></div>
      <div class="pi-node clip" data-layout-allow-overflow id="pi-n3" style="left:540px" data-start="0" data-duration="12" data-track-index="4"><div class="pi-dot">3</div><p class="pi-label">Nouvelles compétences</p></div>
      <div class="pi-node clip" data-layout-allow-overflow id="pi-n4" style="left:740px" data-start="0" data-duration="12" data-track-index="4"><div class="pi-dot">4</div><p class="pi-label">Premiers projets</p></div>
      <div class="pi-node clip" data-layout-allow-overflow id="pi-n5" style="left:940px" data-start="0" data-duration="12" data-track-index="4"><div class="pi-dot">5</div><p class="pi-label">Expertise</p></div>
      <div class="pi-node clip" data-layout-allow-overflow id="pi-n6" style="left:1140px" data-start="0" data-duration="12" data-track-index="4"><div class="pi-dot">6</div><p class="pi-label">Niveau professionnel</p></div>

      <div id="pi-walker" class="clip" data-layout-allow-overflow data-start="0" data-duration="12" data-track-index="5">
        <div id="pi-avatar">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F5E500" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        </div>
      </div>
      <div id="pi-badge" class="clip" data-start="0" data-duration="12" data-track-index="6">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#078D43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>
        Prêt pour le marché
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const steps = [
        { name: 'Débutant', pct: 5 },
        { name: 'Découverte de l’IA', pct: 22 },
        { name: 'Nouvelles compétences', pct: 45 },
        { name: 'Premiers projets', pct: 66 },
        { name: 'Expertise', pct: 85 },
        { name: 'Professionnel', pct: 100 },
      ];
      const nodeX = [0, 200, 400, 600, 800, 1000]; // relatif au départ de la piste
      tl.fromTo('.pi-p, .pi-t', { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

      // État de départ (image 0 = vignette) défini en CSS : étape 1 active, 5 %

      tl.fromTo(['#pi-p0', '#pi-t0'], { opacity: 1, y: 0, filter: 'blur(0px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 2.2, ease: 'none' }, 0);

      // Progression : une étape toutes les 1,6 s
      for (let i = 1; i < 6; i++) {
        const t = 1.0 + i * 1.6;
        tl.to('#pi-walker', { x: nodeX[i], duration: 0.7, ease: 'power3.inOut' }, t - 0.7);
        tl.to('#pi-fill', { scaleX: nodeX[i] / 1000, duration: 0.7, ease: 'power3.inOut' }, t - 0.7);
        tl.to([`#pi-p${i - 1}`, `#pi-t${i - 1}`], { opacity: 0, y: -24, filter: 'blur(6px)', duration: 0.16, ease: 'power3.in' }, t - 0.3);
        tl.fromTo([`#pi-p${i}`, `#pi-t${i}`], { opacity: 0, y: 24, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.3, ease: 'expo.out', immediateRender: false }, t - 0.16);
        tl.to(`#pi-n${i + 1} .pi-dot`, { backgroundColor: '#078D43', borderColor: '#078D43', color: '#ffffff', scale: 1.12, duration: 0.25, ease: 'back.out(2)' }, t - 0.1);
        tl.to(`#pi-n${i + 1} .pi-dot`, { scale: 1, duration: 0.3, ease: 'power2.out' }, t + 0.15);
      }

      // Arrivée : badge « Prêt pour le marché »
      tl.to('#pi-avatar', { backgroundColor: '#078D43', duration: 0.3 }, 9.1);
      tl.to('#pi-badge', { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.6)' }, 9.2);

      // Retour à l'état de départ pour une boucle sans saut
      tl.to('#pi-badge', { opacity: 0, scale: 0.8, duration: 0.2, ease: 'power3.in' }, 11.0);
      tl.to('#pi-walker', { x: 0, duration: 0.6, ease: 'power3.inOut' }, 11.2);
      tl.to('#pi-fill', { scaleX: 0, duration: 0.6, ease: 'power3.inOut' }, 11.2);
      tl.to('#pi-avatar', { backgroundColor: '#080808', duration: 0.3 }, 11.2);
      tl.to(['#pi-n2 .pi-dot', '#pi-n3 .pi-dot', '#pi-n4 .pi-dot', '#pi-n5 .pi-dot', '#pi-n6 .pi-dot'], { backgroundColor: '#ffffff', borderColor: '#bdbdbd', color: '#5f5f5f', duration: 0.3, stagger: -0.05 }, 11.25);
      tl.to(['#pi-p5', '#pi-t5'], { opacity: 0, y: 24, filter: 'blur(6px)', duration: 0.16, ease: 'power3.in' }, 11.3);
      tl.to(['#pi-p0', '#pi-t0'], { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.3, ease: 'expo.out' }, 11.45);

      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
