<!-- PLACEHOLDER — avion de ligne vectoriel, vue de profil, nez vers la DROITE.
     Pour un rendu photoréaliste, remplacer par un PNG détouré (même orientation). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="fus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#f4f7fb"/>
      <stop offset=".75" stop-color="#d5dee9"/><stop offset="1" stop-color="#8d9cb0"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F86F0"/><stop offset="1" stop-color="#0A2A5E"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d3df"/><stop offset="1" stop-color="#7e8ea3"/>
    </linearGradient>
    <linearGradient id="eng" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5f9"/><stop offset=".6" stop-color="#b9c5d3"/><stop offset="1" stop-color="#6d7d92"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a44"/><stop offset="1" stop-color="#3d5a85"/>
    </linearGradient>
    <clipPath id="body"><path d="M150 168 L1010 158 C1095 158 1158 186 1176 214 C1160 238 1105 256 1010 256 L170 256 C120 256 88 244 66 226 L36 182 C70 172 110 169 150 168Z"/></clipPath>
  </defs>
  <!-- aile arrière (côté opposé) -->
  <path d="M600 214 L470 120 L505 116 L700 210Z" fill="#9aa8ba"/>
  <!-- empennage horizontal -->
  <path d="M120 206 L30 160 L58 156 L190 200Z" fill="#a9b6c6"/>
  <!-- dérive -->
  <path d="M74 186 L22 18 L104 18 L238 172Z" fill="url(#tail)"/>
  <circle cx="92" cy="92" r="30" fill="#F5B700"/>
  <path d="M30 140 L200 160 L210 172 L44 160Z" fill="#E63946"/>
  <!-- fuselage -->
  <path d="M150 168 L1010 158 C1095 158 1158 186 1176 214 C1160 238 1105 256 1010 256 L170 256 C120 256 88 244 66 226 L36 182 C70 172 110 169 150 168Z" fill="url(#fus)"/>
  <g clip-path="url(#body)">
    <rect x="0" y="222" width="1200" height="10" fill="#1E6FD9"/>
    <rect x="0" y="232" width="1200" height="5" fill="#F5B700"/>
    <rect x="0" y="244" width="1200" height="20" fill="#7d8ca0" opacity=".35"/>
  </g>
  <!-- hublots -->
  <g fill="url(#glass)">
    <rect x="250" y="186" width="12" height="17" rx="6"/><rect x="278" y="186" width="12" height="17" rx="6"/>
    <rect x="306" y="186" width="12" height="17" rx="6"/><rect x="334" y="186" width="12" height="17" rx="6"/>
    <rect x="362" y="186" width="12" height="17" rx="6"/><rect x="390" y="186" width="12" height="17" rx="6"/>
    <rect x="418" y="186" width="12" height="17" rx="6"/><rect x="446" y="186" width="12" height="17" rx="6"/>
    <rect x="474" y="186" width="12" height="17" rx="6"/><rect x="502" y="186" width="12" height="17" rx="6"/>
    <rect x="530" y="186" width="12" height="17" rx="6"/><rect x="558" y="186" width="12" height="17" rx="6"/>
    <rect x="586" y="186" width="12" height="17" rx="6"/><rect x="614" y="186" width="12" height="17" rx="6"/>
    <rect x="642" y="186" width="12" height="17" rx="6"/><rect x="670" y="186" width="12" height="17" rx="6"/>
    <rect x="698" y="186" width="12" height="17" rx="6"/><rect x="726" y="186" width="12" height="17" rx="6"/>
    <rect x="754" y="186" width="12" height="17" rx="6"/><rect x="782" y="186" width="12" height="17" rx="6"/>
    <rect x="810" y="186" width="12" height="17" rx="6"/><rect x="838" y="186" width="12" height="17" rx="6"/>
    <rect x="866" y="186" width="12" height="17" rx="6"/><rect x="894" y="186" width="12" height="17" rx="6"/>
    <rect x="922" y="186" width="12" height="17" rx="6"/>
    <!-- cockpit -->
    <path d="M1090 182 L1124 182 L1140 196 L1094 198Z"/>
  </g>
  <!-- portes -->
  <g fill="none" stroke="#9fb0c4" stroke-width="2.5">
    <rect x="960" y="176" width="30" height="58" rx="8"/><rect x="200" y="178" width="28" height="56" rx="8"/>
  </g>
  <!-- aile avant -->
  <path d="M560 236 L392 372 L452 378 L728 244Z" fill="url(#wing)"/>
  <path d="M392 372 L452 378 L450 366 L404 362Z" fill="#E63946"/>
  <!-- réacteur -->
  <path d="M530 262 L660 258 C676 258 684 270 684 284 C684 298 676 308 660 308 L530 306 C516 306 508 296 508 284 C508 272 516 262 530 262Z" fill="url(#eng)"/>
  <ellipse cx="682" cy="283" rx="9" ry="24" fill="#2b3a52"/>
  <rect x="560" y="246" width="60" height="16" rx="4" fill="#aab7c7"/>
  <path d="M508 270 L480 276 L480 292 L508 298Z" fill="#59687d"/>
</svg>
